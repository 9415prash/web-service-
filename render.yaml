services:
  - type: web
    name: campus-board
    runtime: docker
    plan: free
    dockerfilePath: ./campus-board/Dockerfile
    dockerContext: ./campus-board
    buildFilter:
      paths:
        - campus-board/**
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
